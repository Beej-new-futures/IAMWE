<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #canvas-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #logo {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      text-align: center;
      pointer-events: none;
      mix-blend-mode: difference;
    }

    #logo img {
      width: clamp(280px, 36vw, 640px);
      height: auto;
      display: block;
      filter: invert(1);
    }

    #scroll-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      color: rgba(0,0,0,0.3);
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: fade-hint 3s ease-in-out infinite;
    }

    @keyframes fade-hint {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 0.7; }
    }

    /* Same corner nav as /work/ and /about/, at the same size. The
       symbols it replaces were charming but unlabelled — three marks
       that only resolved into words on hover, which is a guessing game
       once there are four of them. Difference blend because what sits
       behind here is a moving canvas, not paper, so no fixed colour is
       readable against all of it. */
    .corner {
      position: fixed;
      z-index: 100;
      display: flex;
      gap: 1.8rem;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 0.86rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 400;
      color: #fff;
      mix-blend-mode: difference;
    }
    .corner.tl { top: 1.6rem; left: 1.8rem; }
    .corner.tr { top: 1.6rem; right: 1.8rem; }
    /* The clock reflows every fifteen seconds; tabular figures stop the
       row twitching each time a digit changes width. */
    #clock { font-variant-numeric: tabular-nums; }
    .corner a { color: inherit; text-decoration: none; transition: color 0.25s ease; }
    .corner a:hover,
    .corner a:focus-visible { color: #ff6600; }
    @media (max-width: 620px) {
      .corner { gap: 1.1rem; font-size: 0.72rem; }
      .corner.tl { top: 1.1rem; left: 1.1rem; }
      .corner.tr { top: 1.1rem; right: 1.1rem; }
    }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <canvas id="three-canvas"></canvas>
  </div>

  <div id="logo">
    <img src="/IAMWE_LOGO_.svg" alt="IAMWE">
  </div>

  <div class="corner tl">
    <span>London, (UK)</span>
    <span>·</span>
    <span id="clock">—</span>
    <a href="/work/">Work</a>
  </div>

  <div class="corner tr">
    <a href="/about/">About</a>
    <a href="/treatments/">Treatments</a>
    <a href="mailto:graphicsoloutions@gmail.com">Contact</a>
  </div>

  <div id="scroll-hint">Scroll</div>

  <script>
    // Same clock as the archive page. Bath is London time, and the point
    // of it is that the studio reads as somewhere real and currently
    // awake — so it ticks rather than being stamped once at build.
    (function(){
      var el = document.getElementById('clock');
      if(!el) return;
      var fmt = new Intl.DateTimeFormat('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/London'
      });
      var tick = function(){ el.textContent = fmt.format(new Date()); };
      tick();
      setInterval(tick, 15000);
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
