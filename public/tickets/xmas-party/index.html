<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IAMWE Xmas Party — Friday 18 December · Communa, Frome</title>
<meta name="description" content="IAMWE Xmas Party — Friday 18 December at Communa, Frome. Early bird tickets £20.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="IAMWE Xmas Party">
<meta property="og:description" content="Friday 18 December · Communa, Frome · Early bird £20">
<meta property="og:type" content="website">
<meta property="og:image" content="https://iamwe.uk/tickets/xmas-party/share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; color: #f6f5f1; height: 100%; }
  body { overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ─── Corner nav — same placement and size as the rest of the site ─── */
  .corner {
    position: fixed; z-index: 50; top: 1.6rem;
    display: flex; gap: 1.8rem; align-items: baseline;
    font-family: 'Space Mono', ui-monospace, Menlo, monospace;
    font-size: 0.86rem; letter-spacing: 0.09em; text-transform: uppercase;
    color: #fff; mix-blend-mode: difference;
  }
  .corner.tl { left: 1.8rem; }
  .corner.tr { right: 1.8rem; }
  .corner a { color: inherit; text-decoration: none; transition: opacity .2s ease; }
  .corner a:hover { opacity: .6; }
  .corner img { height: 0.95rem; width: auto; display: block; filter: invert(1); }
  @media (max-width: 620px) {
    .corner { top: 1.1rem; font-size: 0.72rem; }
    .corner.tl { left: 1.1rem; } .corner.tr { right: 1.1rem; }
  }

  /* ─── The film ─────────────────────────────────────────────────────
     One screen. The film loops on black, shown whole (it's 3:4, so
     cropping to fill would cut the cookies off on phones and desktops). */
  .stage { position: fixed; inset: 0; background: #000; }
  .stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* ─── BUY TICKETS ──────────────────────────────────────────────────
     Two layers in the same spot, dead centre:
     .pill-shape  the blue pill, difference-blended with the film —
                  blue over black, warm yellow over the cookies.
     .pill-type   the black type and the real link, on top, unblended,
                  so it reads on both.
     The shape layer carries an invisible copy of the label purely so
     both pills are exactly the same width. Retune with --pill / --pill-h. */
  .pill-layer {
    --pill: #2a55ff;
    --pill-h: clamp(74px, 6.4vw, 96px);
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .pill-shape { mix-blend-mode: difference; z-index: 10; }
  .pill-type { z-index: 11; }
  .pill {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    height: var(--pill-h); padding: 0 calc(var(--pill-h) * 0.62);
    border-radius: 999px;
    color: #000; text-decoration: none;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 2.5vw, 36px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pill-type .pill { pointer-events: auto; }
  .pill-bg {
    position: absolute; inset: 0; border-radius: inherit;
    background: var(--pill);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .pill-label { position: relative; }
  .pill-shape .pill-label { visibility: hidden; }
  body:has(.pill-type .pill:hover) .pill-bg { transform: scale(1.06); }
  .pill:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

  <h1 class="sr-only">IAMWE Xmas Party — Friday 18 December, Communa, Frome</h1>

  <div class="corner tl">
    <a href="/" aria-label="IAMWE home"><img src="/IAMWE_LOGO_TRIM.svg" alt="IAMWE"></a>
  </div>
  <div class="corner tr">
    <a href="https://buytickets.at/iamwe/2542622">Tickets</a>
  </div>

  <!-- loop.mp4 = imwe_xmas_26_v02.mp4 cut at 23.8s, before the "Link in
       the Bio" end card. share.jpg doubles as the poster, shown if a phone
       won't autoplay (e.g. iPhone in Low Power Mode). -->
  <div class="stage">
    <video src="/tickets/xmas-party/loop.mp4" poster="/tickets/xmas-party/share.jpg"
           autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  </div>

  <div class="pill-layer pill-shape" aria-hidden="true">
    <span class="pill"><span class="pill-bg"></span><span class="pill-label">Buy tickets</span></span>
  </div>
  <div class="pill-layer pill-type">
    <!-- Ticket Tailor handles checkout, tickets, emails and the door. -->
    <a class="pill" href="https://buytickets.at/iamwe/2542622"><span class="pill-label">Buy tickets</span></a>
  </div>

</body>
</html>
