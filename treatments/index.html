<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatments — IAMWE</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="IAMWE treatments — in development.">
  <style>
    /* Same tokens as about.css — kept inline, like the homepage, so this
       page carries no dependency on the about stylesheet's hero rules. */
    :root {
      --iw-bg: #f6f5f1;
      --iw-ink: #141414;
      --iw-ink-soft: rgba(20, 20, 20, 0.55);
      --iw-ink-faint: rgba(20, 20, 20, 0.35);
      --iw-rule: rgba(20, 20, 20, 0.12);
      --iw-accent: #ff6600;

      --iw-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --iw-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      background: var(--iw-bg);
      color: var(--iw-ink);
      font-family: var(--iw-sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .mono {
      font-family: var(--iw-mono);
      font-size: 0.66rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ─── Corner nav ──────────────────────────────────────────────── */
    .corner {
      position: fixed;
      z-index: 40;
      display: flex;
      gap: 1.4rem;
      color: var(--iw-ink);
    }
    .corner.tl { top: 1.6rem; left: 1.8rem; }
    .corner.tr { top: 1.6rem; right: 1.8rem; }
    .corner a { transition: color 0.25s ease; }
    .corner a:hover,
    .corner a:focus-visible { color: var(--iw-accent); }

    /* ─── Page ────────────────────────────────────────────────────── */
    .tr-page {
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 8rem 1.8rem 4rem;
    }

    .tr-inner {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .tr-intro { margin-bottom: 3.4rem; }

    .tr-intro .eyebrow {
      display: block;
      color: var(--iw-ink-faint);
      margin-bottom: 1.1rem;
    }

    .tr-intro h1 {
      font-size: clamp(1.9rem, 4.4vw, 3rem);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.015em;
      text-wrap: balance;
      margin-bottom: 1rem;
    }

    .tr-intro p {
      color: var(--iw-ink-soft);
      font-size: 0.98rem;
      line-height: 1.65;
      max-width: 46ch;
    }

    /* ─── The list ────────────────────────────────────────────────── */
    .tr-list { border-top: 1px solid var(--iw-rule); }

    .tr-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.55rem 0;
      border-bottom: 1px solid var(--iw-rule);
      transition: padding-left 0.28s ease, color 0.28s ease;
    }
    .tr-item:hover,
    .tr-item:focus-visible {
      color: var(--iw-accent);
      padding-left: 0.7rem;
    }
    .tr-item:focus-visible { outline: 2px solid var(--iw-accent); outline-offset: 4px; }

    .tr-item-name {
      font-size: clamp(1.15rem, 2.3vw, 1.5rem);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .tr-item-name .x { color: var(--iw-accent); }

    .tr-item-meta {
      color: var(--iw-ink-faint);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tr-item:hover .tr-item-meta { color: var(--iw-accent); }

    .tr-foot {
      margin-top: 2.6rem;
      color: var(--iw-ink-faint);
    }

    @media (max-width: 620px) {
      .tr-page { padding-top: 6.5rem; }
      .tr-item { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tr-item, .corner a { transition: none; }
    }

    /* ─── Access gate ────────────────────────────────────────────────
       The whole Treatments section sits behind this now, not each
       individual treatment — one door at the front. Unlocking sets a
       key that the treatment pages themselves read, so nobody is asked
       twice in the same visit. */
    #gate {
      position: fixed; inset: 0; z-index: 100;
      background: var(--iw-bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.4rem; padding: 1.5rem; text-align: center;
    }
    #gate.unlocked { display: none; }
    html.locked { overflow: hidden; }
    html.locked body > *:not(#gate) { visibility: hidden; }
    #gate .gate-mark {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 500; letter-spacing: -0.01em;
    }
    #gate .gate-note { color: var(--iw-ink-faint); }
    #gate form { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
    #gate input {
      font-family: var(--iw-mono); font-size: 0.85rem; letter-spacing: 0.12em;
      padding: 0.85rem 1.2rem; width: min(240px, 70vw); text-align: center;
      background: transparent; border: 1px solid var(--iw-ink); color: var(--iw-ink);
    }
    #gate input::placeholder { color: var(--iw-ink-faint); letter-spacing: 0.12em; }
    #gate input:focus { outline: 2px solid var(--iw-accent); outline-offset: 2px; }
    #gate button {
      font-family: var(--iw-mono); font-size: 0.72rem; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 0.85rem 1.6rem; cursor: pointer;
      background: var(--iw-ink); color: var(--iw-bg); border: 1px solid var(--iw-ink);
      transition: background 0.22s ease, color 0.22s ease;
    }
    #gate button:hover { background: var(--iw-accent); border-color: var(--iw-accent); }
    #gate .gate-error {
      font-family: var(--iw-mono); font-size: 0.72rem;
      color: var(--iw-accent); min-height: 1.3em;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       ACCESS GATE — password: WNTR2026
       Guards the whole Treatments section. To change it, run this in a
       browser console with the new password and paste the result over
       PASS_HASH below — then do the same in every treatment's own
       guard script (they compare against the same value):
         crypto.subtle.digest('SHA-256', new TextEncoder().encode('NEWPASSWORD'))
           .then(b => console.log([...new Uint8Array(b)]
           .map(x => x.toString(16).padStart(2,'0')).join('')))
       ============================================================ -->
  <div id="gate">
    <p class="gate-mark">Treatments</p>
    <p class="gate-note mono">Private — password required</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" placeholder="Password" aria-label="Password" autocomplete="off">
      <button type="submit">Enter</button>
    </form>
    <p class="gate-error mono" id="gate-error" role="alert"></p>
  </div>

  <script>
  (function(){
    var PASS_HASH = '6d5277d40e9832ff6b90bffffff28e73bfb4cb3a4c0bf9cb86e972fa329bbf9e';
    var KEY = 'iw-treatments-access';
    var root = document.documentElement, gate = document.getElementById('gate');
    function remembered(){ try { return sessionStorage.getItem(KEY) === PASS_HASH; } catch(e){ return false; } }
    function unlock(){ gate.classList.add('unlocked'); root.classList.remove('locked'); }
    function hash(str){
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
        return [].slice.call(new Uint8Array(buf)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
      });
    }
    if (remembered()) { unlock(); } else { root.classList.add('locked'); }
    document.getElementById('gate-form').addEventListener('submit', function(e){
      e.preventDefault();
      var input = document.getElementById('gate-input'), err = document.getElementById('gate-error');
      hash(input.value.trim()).then(function(h){
        if (h === PASS_HASH) { try { sessionStorage.setItem(KEY, h); } catch(e){} unlock(); }
        else { err.textContent = 'Not quite — try again.'; input.value = ''; input.focus(); }
      });
    });
  })();
  </script>

  <div class="corner tl mono">
    <span>Treatments</span>
  </div>
  <div class="corner tr mono">
    <a href="/">Home</a>
    <a href="/work/">Work</a>
    <a href="/about/">About</a>
  </div>

  <div class="tr-page">
    <div class="tr-inner">

      <div class="tr-intro">
        <span class="eyebrow mono">In development</span>
        <h1>Treatments</h1>
        <p>Work in progress — ideas being built with the people they're
        being built for. Access by arrangement.</p>
      </div>

      <div class="tr-list">

        <!-- One <a> per treatment. Copy the block to add another. -->
        <a class="tr-item" href="/treatments/wntr-shires-yard/">
          <span class="tr-item-name">WNTR <span class="x">×</span> Shires Yard</span>
          <span class="tr-item-meta mono">Bath · Midwinter 2026</span>
        </a>

      </div>

      <p class="tr-foot mono">Access by arrangement</p>

    </div>
  </div>

</body>
</html>
